
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clearance Hub Demo</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

<style>
:root{
  --bg:#eef1f4;
  --card:#ffffff;
  --primary:#0c9b8a;
  --primary-dark:#08796d;
  --primary-light:#22b7a3;
  --navy:#061736;

  --text:#071426;
  --muted:#718096;

  --success:#22c55e;
  --warning:#f59e0b;
  --info:#3b82f6;

  --border:#e6ebf1;

  --shadow:
    0 10px 25px rgba(0,0,0,.06);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  width:min(100%, 430px);
  margin:auto;
  min-height:100vh;
  padding:18px 14px 30px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.brand small{
  font-size:10px;
  letter-spacing:4px;
  color:#7e8793;
  font-weight:700;
}

.brand h1{
  font-size:24px;
  font-weight:900;
}

.top-icon{
  width:46px;
  height:46px;
  background:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow);
  font-size:20px;
}

.hero-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:32px;
  padding:22px;
  color:white;
  box-shadow:0 20px 35px rgba(12,155,138,.22);
  margin-bottom:20px;
}

.hero-card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:rgba(255,255,255,.07);
  border-radius:50%;
  top:-70px;
  right:-50px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-radius:18px;
  background:rgba(255,255,255,.14);
  margin-bottom:18px;
  font-size:13px;
  font-weight:700;
}

.hero-card h2{
  font-size:32px;
  line-height:1.1;
  margin-bottom:8px;
  font-weight:900;
}

.hero-card p{
  font-size:14px;
  line-height:1.6;
  color:rgba(255,255,255,.88);
}

.field-label{
  display:block;
  margin:18px 0 8px;
  font-size:13px;
  font-weight:700;
}

.field{
  width:100%;
  height:54px;
  border:none;
  border-radius:18px;
  padding:0 18px;
  font-size:15px;
  outline:none;
  background:rgba(255,255,255,.16);
  color:white;
}

.field::placeholder{
  color:rgba(255,255,255,.75);
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.btn{
  border:none;
  height:52px;
  border-radius:18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}

.btn:active{
  transform:scale(.97);
}

.btn.primary{
  flex:1;
  background:var(--navy);
  color:white;
}

.btn.ghost{
  width:110px;
  background:rgba(255,255,255,.16);
  color:white;
}

.results-card{
  margin-top:10px;
}

.section-title h3{
  font-size:30px;
  font-weight:900;
}

.section-title p{
  margin-top:4px;
  color:#697586;
  font-size:14px;
}

.status-pill{
  display:inline-flex;
  margin-top:12px;
  background:#dff7f1;
  color:#08796d;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

.table-wrap,
.empty-state,
.hint-state{
  margin-top:16px;
  background:white;
  border-radius:28px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.empty-state,
.hint-state{
  padding:24px;
  color:#667085;
  line-height:1.7;
}

.table-wrap table{
  width:100%;
  border-collapse:collapse;
}

.table-wrap thead{
  background:#f5f7fb;
}

.table-wrap th{
  padding:18px;
  text-align:left;
  font-size:12px;
  text-transform:uppercase;
  color:#7b8794;
}

.table-wrap td{
  padding:18px;
  border-top:1px solid #eef2f6;
}

.full-name{
  font-weight:800;
}

.view-btn{
  border:none;
  background:var(--navy);
  color:white;
  padding:12px 18px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

@media(max-width:480px){

  .hero-card h2{
    font-size:26px;
  }

  .section-title h3{
    font-size:24px;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr;
  }

  .btn.ghost,
  .btn.primary{
    width:100%;
  }
}

</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <small>CLEARANCE HUB</small>
      <h1>Homepage</h1>
    </div>

    <div class="top-icon">
      <i class="ri-notification-3-line"></i>
    </div>
  </header>

  <section class="hero-card">

    <div class="pill">
      <i class="ri-search-2-line"></i>
      Search Graduating Students
    </div>

    <h2>Find a record by name</h2>

    <p>
      Type the first name and last name, then search.
      Demo only works for Mark Anthony Caitor.
    </p>

    <label class="field-label">First Name</label>
    <input
      type="text"
      id="firstName"
      class="field"
      placeholder="Mark Anthony"
    />

    <label class="field-label">Last Name</label>
    <input
      type="text"
      id="lastName"
      class="field"
      placeholder="Caitor"
    />

    <div class="actions">
      <button class="btn primary" id="searchBtn" type="button">
        Search Alumni
      </button>

      <button class="btn ghost" id="clearBtn" type="button">
        Clear
      </button>
    </div>

  </section>

  <section class="results-card">

    <div class="section-title">
      <h3>Search Results</h3>
      <p>Matching records will appear here.</p>
    </div>

    <div id="resultCount" class="status-pill">
      0 record
    </div>

    <div id="resultsArea" class="hint-state">
      Enter a first name and last name then tap Search Alumni.
    </div>

  </section>

</div>

<script>
const firstNameEl = document.getElementById('firstName');
const lastNameEl = document.getElementById('lastName');
const searchBtn = document.getElementById('searchBtn');
const clearBtn = document.getElementById('clearBtn');
const resultsArea = document.getElementById('resultsArea');
const resultCount = document.getElementById('resultCount');

const demoRecord = {
  firstName: 'mark anthony',
  lastName: 'caitor',
  fullName: 'Caitor, Mark Anthony'
};

function normalize(value){
  return value.trim().replace(/\s+/g, ' ').toLowerCase();
}

function renderNoResult(message){
  resultsArea.innerHTML = `
    <div class="empty-state">
      ${message}
    </div>
  `;

  resultCount.textContent = '0 record';
}

function renderResult(){

  resultsArea.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td class="full-name">${demoRecord.fullName}</td>
            <td>
              <button class="view-btn" id="viewDemoBtn">
                View
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  `;

  resultCount.textContent = '1 record';

  document.getElementById('viewDemoBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
}

function searchAlumni(){

  const first = normalize(firstNameEl.value);
  const last = normalize(lastNameEl.value);

  if(!first || !last){
    renderNoResult('Please enter both first name and last name.');
    return;
  }

  const matchFirst = first === demoRecord.firstName;
  const matchLast = last === demoRecord.lastName;

  if(matchFirst && matchLast){
    renderResult();
  }
  else{
    renderNoResult('No record found for the selected name.');
  }
}

searchBtn.addEventListener('click', searchAlumni);

clearBtn.addEventListener('click', () => {

  firstNameEl.value = '';
  lastNameEl.value = '';

  resultsArea.innerHTML = `
    Enter a first name and last name then tap Search Alumni.
  `;

  resultCount.textContent = '0 record';
});
</script>

</body>
</html>
